name: Daily Trading Cycle

on:
  schedule:
    # UTC 23:00, 일~목 = KST 08:00, 월~금. (한국 시간 기준 평일 아침에 실행)
    - cron: "0 23 * * 0-4"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily trading cycle
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_PAPER: "true"  # 모의투자 검증 기간 동안은 항상 true로 유지
        run: python run_daily.py

      - name: Commit updated state
        run: |
          git config user.name "stock-agents-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/live_state.json
          git diff --cached --quiet || git commit -m "chore: daily trading cycle $(date -u +%Y-%m-%d)"
          git push
